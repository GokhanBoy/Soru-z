name: SoruCoz APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 kur
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: SoruCoz projesini oluştur
        run: |
          mkdir -p app/src/main/java/com/sorucoz/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SoruCoz"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sorucoz.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sorucoz.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          mkdir -p app/src/main

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="SoruÇöz"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sorucoz/app/MainActivity.java <<'EOF'
          package com.sorucoz.app;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.*;
          import android.widget.*;

          import org.json.*;

          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private ImageView imageView;
              private TextView result;
              private EditText apiKey;
              private Spinner subject;
              private Spinner mode;
              private Bitmap selectedBitmap;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 35, 32, 50);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("📚 SoruÇöz");
                  title.setTextSize(30);
                  title.setTypeface(null, Typeface.BOLD);
                  root.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("\nYapamadığın sorunun fotoğrafını yükle, çözümünü öğren.\n");
                  subtitle.setTextSize(16);
                  root.addView(subtitle);

                  apiKey = new EditText(this);
                  apiKey.setHint("OpenAI API anahtarı");
                  apiKey.setSingleLine(true);
                  root.addView(apiKey);

                  TextView dersBaslik = new TextView(this);
                  dersBaslik.setText("\nDers:");
                  dersBaslik.setTypeface(null, Typeface.BOLD);
                  root.addView(dersBaslik);

                  subject = new Spinner(this);
                  String[] subjects = {
                      "Otomatik seç",
                      "Matematik",
                      "Fizik",
                      "Kimya",
                      "Biyoloji",
                      "Türkçe"
                  };
                  subject.setAdapter(new ArrayAdapter<>(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      subjects
                  ));
                  root.addView(subject);

                  TextView modBaslik = new TextView(this);
                  modBaslik.setText("\nÇözüm türü:");
                  modBaslik.setTypeface(null, Typeface.BOLD);
                  root.addView(modBaslik);

                  mode = new Spinner(this);
                  String[] modes = {
                      "Adım adım çöz",
                      "Kısa çözüm",
                      "Sadece ipucu"
                  };
                  mode.setAdapter(new ArrayAdapter<>(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      modes
                  ));
                  root.addView(mode);

                  Button gallery = new Button(this);
                  gallery.setText("🖼️ Galeriden soru seç");
                  root.addView(gallery);

                  Button camera = new Button(this);
                  camera.setText("📷 Fotoğraf çek");
                  root.addView(camera);

                  imageView = new ImageView(this);
                  imageView.setAdjustViewBounds(true);
                  imageView.setMinimumHeight(350);
                  imageView.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                  root.addView(imageView);

                  Button solve = new Button(this);
                  solve.setText("✨ SORUYU ÇÖZ");
                  solve.setTextSize(18);
                  root.addView(solve);

                  result = new TextView(this);
                  result.setTextSize(17);
                  result.setPadding(5, 30, 5, 40);
                  root.addView(result);

                  gallery.setOnClickListener(v -> openGallery());
                  camera.setOnClickListener(v -> openCamera());
                  solve.setOnClickListener(v -> solveQuestion());

                  setContentView(scroll);
              }

              private void openGallery() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("image/*");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(intent, 100);
              }

              private void openCamera() {
                  Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);

                  if (intent.resolveActivity(getPackageManager()) != null) {
                      startActivityForResult(intent, 101);
                  } else {
                      Toast.makeText(this, "Kamera açılamadı.", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (resultCode != RESULT_OK || data == null) return;

                  try {
                      if (requestCode == 100 && data.getData() != null) {
                          Uri uri = data.getData();
                          selectedBitmap = MediaStore.Images.Media.getBitmap(
                              getContentResolver(),
                              uri
                          );
                      }

                      if (requestCode == 101 && data.getExtras() != null) {
                          selectedBitmap = (Bitmap) data.getExtras().get("data");
                      }

                      if (selectedBitmap != null) {
                          imageView.setImageBitmap(selectedBitmap);
                          result.setText("");
                      }

                  } catch (Exception e) {
                      Toast.makeText(this, "Fotoğraf açılamadı.", Toast.LENGTH_LONG).show();
                  }
              }

              private void solveQuestion() {

                  String key = apiKey.getText().toString().trim();

                  if (key.isEmpty()) {
                      Toast.makeText(
                          this,
                          "Önce API anahtarını gir.",
                          Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  if (selectedBitmap == null) {
                      Toast.makeText(
                          this,
                          "Önce sorunun fotoğrafını seç.",
                          Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  result.setText("⏳ Soru inceleniyor...");

                  Executors.newSingleThreadExecutor().execute(() -> {

                      try {
                          ByteArrayOutputStream output = new ByteArrayOutputStream();
                          selectedBitmap.compress(Bitmap.CompressFormat.JPEG, 85, output);

                          String image64 = Base64.encodeToString(
                              output.toByteArray(),
                              Base64.NO_WRAP
                          );

                          String selectedSubject =
                              subject.getSelectedItem().toString();

                          String selectedMode =
                              mode.getSelectedItem().toString();

                          String prompt =
                              "Sen öğrencilere yardımcı olan Türkçe bir soru çözüm öğretmenisin. " +
                              "Fotoğraftaki soruyu dikkatlice oku. " +
                              "Ders: " + selectedSubject + ". " +
                              "İstenen anlatım: " + selectedMode + ". " +
                              "Sorunun ne istediğini kısaca belirt. " +
                              "Çözümü anlaşılır biçimde açıkla. " +
                              "Gerekliyse formülleri ve işlem adımlarını göster. " +
                              "Sonucu en sonda belirt. " +
                              "Fotoğraf okunamıyorsa tahmin etme; daha net fotoğraf iste.";

                          JSONObject root = new JSONObject();
                          root.put("model", "gpt-5.4-mini");
                          root.put("max_output_tokens", 1500);

                          JSONArray input = new JSONArray();
                          JSONObject message = new JSONObject();
                          message.put("role", "user");

                          JSONArray content = new JSONArray();

                          JSONObject text = new JSONObject();
                          text.put("type", "input_text");
                          text.put("text", prompt);

                          JSONObject image = new JSONObject();
                          image.put("type", "input_image");
                          image.put(
                              "image_url",
                              "data:image/jpeg;base64," + image64
                          );

                          content.put(text);
                          content.put(image);

                          message.put("content", content);
                          input.put(message);
                          root.put("input", input);

                          URL url = new URL(
                              "https://api.openai.com/v1/responses"
                          );

                          HttpURLConnection connection =
                              (HttpURLConnection) url.openConnection();

                          connection.setRequestMethod("POST");
                          connection.setRequestProperty(
                              "Authorization",
                              "Bearer " + key
                          );
                          connection.setRequestProperty(
                              "Content-Type",
                              "application/json"
                          );

                          connection.setConnectTimeout(30000);
                          connection.setReadTimeout(90000);
                          connection.setDoOutput(true);

                          try (OutputStream os = connection.getOutputStream()) {
                              os.write(
                                  root.toString().getBytes(StandardCharsets.UTF_8)
                              );
                          }

                          int status = connection.getResponseCode();

                          InputStream stream =
                              status >= 200 && status < 300
                              ? connection.getInputStream()
                              : connection.getErrorStream();

                          BufferedReader reader = new BufferedReader(
                              new InputStreamReader(
                                  stream,
                                  StandardCharsets.UTF_8
                              )
                          );

                          StringBuilder response = new StringBuilder();
                          String line;

                          while ((line = reader.readLine()) != null) {
                              response.append(line);
                          }

                          if (status < 200 || status >= 300) {
                              throw new Exception(
                                  "API hatası (" +
                                  status +
                                  "): " +
                                  response
                              );
                          }

                          JSONObject json =
                              new JSONObject(response.toString());

                          String answer = extractAnswer(json);

                          runOnUiThread(() ->
                              result.setText("✅ Çözüm\n\n" + answer)
                          );

                      } catch (Exception e) {
                          runOnUiThread(() ->
                              result.setText(
                                  "❌ Çözüm alınamadı.\n\n" +
                                  e.getMessage()
                              )
                          );
                      }
                  });
              }

              private String extractAnswer(JSONObject json)
                  throws JSONException {

                  JSONArray output = json.optJSONArray("output");

                  if (output == null) {
                      return "Yanıt bulunamadı.";
                  }

                  StringBuilder answer = new StringBuilder();

                  for (int i = 0; i < output.length(); i++) {

                      JSONObject item = output.getJSONObject(i);
                      JSONArray content = item.optJSONArray("content");

                      if (content == null) continue;

                      for (int j = 0; j < content.length(); j++) {

                          JSONObject part = content.getJSONObject(j);

                          if ("output_text".equals(
                                  part.optString("type")
                              )) {

                              answer.append(
                                  part.optString("text")
                              );
                          }
                      }
                  }

                  if (answer.length() == 0) {
                      return "Model yanıt verdi ancak metin bulunamadı.";
                  }

                  return answer.toString();
              }
          }
          EOF

      - name: APK oluştur
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SoruCoz.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SoruCoz-APK
          path: SoruCoz.apk
