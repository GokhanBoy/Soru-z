name: SoruCoz PDF APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 kur
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: PDF sürümünü hazırla
        run: |
          echo '' | base64 -d > SoruCozPDFProject.zip
          unzip -o SoruCozPDFProject.zip

      - name: APK oluştur
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SoruCoz-PDF.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SoruCoz-PDF-APK
          path: SoruCoz-PDF.apk
